name: post-to-bluesky
on:
  schedule:
    - cron: "7 3 * * *"     # 日本時間 12:07 動画
    - cron: "7 11 * * *"    # 日本時間 20:07 動画
    - cron: "37 11 * * 0"   # 日本時間 日曜 20:37 今週のまとめ
  push:
    paths: ["bluesky_pin.txt"]   # このファイルを置くと自己紹介を固定（1回）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bluesky
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post to Bluesky
        env:
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            [ -f bluesky_pin.txt ] && python tools/post_bluesky.py pin && git rm -q bluesky_pin.txt || true
          elif [ "${{ github.event.schedule }}" = "37 11 * * 0" ]; then
            python tools/post_bluesky.py weekly
          else
            python tools/post_bluesky.py
          fi
      - name: Save record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A output bluesky_pin.txt 2>/dev/null || git add -A output
          git commit -m "post: bluesky" || exit 0
          git pull --rebase -q origin main && git push
