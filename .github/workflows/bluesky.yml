name: post-to-bluesky
on:
  schedule:
    - cron: "7 3 * * *"    # 日本時間 12:07
    - cron: "7 11 * * *"   # 日本時間 20:07
  workflow_dispatch:
  push:
    paths: [".github/workflows/bluesky.yml"]  # 設定を変えた時に1回だけ動く
permissions:
  contents: write
concurrency:
  group: bluesky
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post one video to Bluesky
        env:
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python tools/post_bluesky.py
      - name: Save record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add output
          git commit -m "post: bluesky" || exit 0
          git pull --rebase -q origin main && git push
