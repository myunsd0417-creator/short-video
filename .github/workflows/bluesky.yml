name: post-to-bluesky
on:
  schedule:
    - cron: "17 * * * *"    # 1時間ごとに確認。投稿は 12〜16時・20〜24時に1本ずつ、日曜20時以降に今週のまとめ
  push:
    paths: ["bluesky_pin.txt", "bluesky_now.txt"]   # 自己紹介の固定（1回）／今すぐ確認
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bluesky
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post to Bluesky
        env:
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ -f bluesky_pin.txt ]; then
            python tools/post_bluesky.py pin && git rm -q bluesky_pin.txt || true
          else
            python tools/post_bluesky.py auto
            [ -f bluesky_now.txt ] && git rm -q bluesky_now.txt || true
          fi
      - name: Save record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A output; git add -A bluesky_pin.txt bluesky_now.txt 2>/dev/null || true
          git commit -m "post: bluesky" || exit 0
          git pull --rebase -q origin main && git push
