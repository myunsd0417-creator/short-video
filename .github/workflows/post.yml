name: post-to-buffer
on:
  push:
    paths: ["requeue.txt", "config.json", "tools/post_buffer.py", "tools/metrics.py", ".github/workflows/post.yml"]
  schedule:
    - cron: "40 21 * * *"   # 毎日 日本時間 6:40 に予約を補充
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cancel queued posts to be replaced (requeue.txt)
        if: hashFiles('requeue.txt') != ''
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python tools/requeue.py $(cat requeue.txt)
          git rm -q requeue.txt
      - name: Schedule videos on Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python tools/post_buffer.py
      - name: Collect view counts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python tools/metrics.py || true
      - name: Save record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add output
          git commit -m "post: buffer schedule" || exit 0
          git pull --rebase -q origin main && git push
