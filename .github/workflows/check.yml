name: check-channels
on:
  push:
    paths: ["tools/check_channels.py", ".github/workflows/check.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Buffer channels and post errors
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python tools/check_channels.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add output/channel_check.json
          git commit -m "check: channels" || exit 0
          git pull --rebase -q origin main && git push
