name: rakuten-candidates
on:
  schedule:
    - cron: "23 22 * * 1"   # 日本時間 火曜 7:23（週1回）
  push:
    paths: ["tools/rakuten_candidates.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect Rakuten product candidates
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python tools/rakuten_candidates.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add output
          git commit -m "rakuten: candidates" || exit 0
          git pull --rebase -q origin main && git push
